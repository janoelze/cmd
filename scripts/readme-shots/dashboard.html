<!doctype html>
<!-- The browser window's page in README screenshots: a made-up live telemetry
     dashboard for the core, drawn from a seeded random walk so every run looks the same. -->
<meta charset="utf-8">
<title>core telemetry</title>
<style>
  /* Pastel Light / Pastel Dark colours; the page follows the app's appearance. */
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e1e4e8; --text: #24272b; --dim: #6b717a;
    --blue: #2f7cc0; --magenta: #9c4fb6; --green: #4f8a35; --yellow: #94771c; --red: #c0434e; --cyan: #1f8893;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --panel: #171a1f; --line: #262a31; --text: #e3e6ea; --dim: #7d848e;
      --blue: #8ab4e8; --magenta: #c8a2e0; --green: #a8cc8c; --yellow: #dbcb8b; --red: #e88388; --cyan: #66c2cd;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: var(--bg); color: var(--text); font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .live { display: inline-flex; align-items: center; gap: 5px; color: var(--green); font-size: 11px; }
  .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .range { margin-left: auto; color: var(--dim); font-size: 11px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .k { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
  .v { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .v small { font-size: 11px; color: var(--dim); font-weight: 400; }
  .d { font-size: 10px; margin-top: 2px; }
  .up { color: var(--green); } .down { color: var(--red); }
  .chart { margin-bottom: 8px; }
  .chart .top { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .legend span { margin-left: 10px; color: var(--dim); font-size: 10px; }
  .legend i { display: inline-block; width: 8px; height: 2px; vertical-align: middle; margin-right: 4px; }
  svg { display: block; width: 100%; height: 96px; }
  .bars { display: grid; gap: 5px; margin-top: 6px; }
  .bar { display: grid; grid-template-columns: 9ch 1fr 5ch; white-space: nowrap; align-items: center; gap: 8px; font-size: 11px; }
  .bar .t { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar .t b { display: block; height: 100%; border-radius: 3px; }
  .bar .n { text-align: right; color: var(--dim); }
  .log { margin-top: 8px; font-size: 11px; white-space: nowrap; overflow: hidden; }
  .log div { overflow: hidden; text-overflow: ellipsis; }
  .ts { color: var(--dim); }
</style>
<header><h1>cmd · core telemetry</h1><span class="live">live</span><span class="range">last 15 min</span></header>
<div class="kpis">
  <div class="panel"><div class="k">pty out</div><div class="v">48.2<small> MB/s</small></div><div class="d up">▲ 12%</div></div>
  <div class="panel"><div class="k">rpc p99</div><div class="v">3.1<small> ms</small></div><div class="d up">▼ 0.4 ms</div></div>
  <div class="panel"><div class="k">agents</div><div class="v">5<small> · 2 busy</small></div><div class="d down">1 waiting</div></div>
</div>
<div class="panel chart">
  <div class="top"><span class="k">rpc latency</span><span class="legend"><span><i style="background:var(--blue)"></i>p50</span><span><i style="background:var(--magenta)"></i>p99</span></span></div>
  <svg id="lat" viewBox="0 0 300 96" preserveAspectRatio="none"></svg>
</div>
<div class="panel">
  <span class="k">tokens / agent</span>
  <div class="bars" id="bars"></div>
  <div class="log" id="log"></div>
</div>
<script>
  // Seeded PRNG (mulberry32), so the page is identical on every run.
  let seed = 7;
  const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const walk = (n, base, spread) => { let v = base; return Array.from({ length: n }, () => (v = Math.max(4, v + (rnd() - 0.5) * spread + (base - v) * 0.15))); };
  const N = 90, W = 300, H = 96;
  const series = [[walk(N, 26, 10), "var(--blue)"], [walk(N, 62, 26), "var(--magenta)"]];
  const max = 100;
  const pts = (s) => s.map((v, i) => `${(i / (N - 1)) * W},${H - (v / max) * H}`).join(" ");
  const svg = document.getElementById("lat");
  svg.innerHTML =
    [0.25, 0.5, 0.75].map((f) => `<line x1="0" x2="${W}" y1="${H * f}" y2="${H * f}" stroke="var(--line)" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>`).join("") +
    series.map(([s, c], i) => `<defs><linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
      <polygon points="0,${H} ${pts(s)} ${W},${H}" fill="url(#g${i})"/>
      <polyline points="${pts(s)}" fill="none" stroke="${c}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`).join("");
  const agents = [["minimap", 68, "var(--blue)"], ["reconnect", 44, "var(--yellow)"], ["recent", 81, "var(--green)"], ["explore", 29, "var(--cyan)"]];
  document.getElementById("bars").innerHTML = agents
    .map(([n, v, c]) => `<div class="bar"><span>${n}</span><span class="t"><b style="width:${v}%;background:${c}"></b></span><span class="n">${(v * 1.7).toFixed(0)}k</span></div>`)
    .join("");
  const log = [
    ["15:06:41", "var(--blue)", "hook", "PreToolUse Edit canvas.ts"],
    ["15:06:39", "var(--yellow)", "hook", "PermissionRequest Bash"],
    ["15:06:37", "var(--cyan)", "agent", "subagent Explore → done"],
    ["15:06:32", "var(--green)", "hook", "Stop recent-sessions"],
    ["15:06:30", "var(--magenta)", "pty", "resize 96×38 → 64×31"],
  ];
  document.getElementById("log").innerHTML = log.map(([t, c, k, m]) => `<div><span class="ts">${t}</span> <span style="color:${c}">${k.padEnd(5)}</span> ${m}</div>`).join("");
</script>
