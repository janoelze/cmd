# Packages the built app (out/) plus the staged core runtime (.runtime, from
# scripts/stage-runtime.mjs): a macOS .app, .dmg and .zip, or a Windows
# installer (NSIS, per user, no admin rights) and .zip.
# Signing kicks in when a Developer ID is in the keychain; CI notarizes the dmg
# itself, so electron-builder doesn't notarize the app (see .github/workflows/build.yml).
appId: dev.janoelze.cmd
productName: cmd
copyright: Copyright © 2026 Jan Oelze
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!node_modules/**/*"
extraResources:
  - from: .runtime
    to: runtime
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  # icon.icns is the flat icon for macOS 15 and older; macOS 26 uses the Liquid Glass
  # icon in Assets.car (named by CFBundleIconName). Both come from build/icon.icon
  # via `pnpm icons` and are committed, so CI needs no Xcode 26.
  icon: build/icon.icns
  extraResources:
    - from: build/Assets.car
      to: Assets.car
    # The Dock icon per theme (src/main/dock-icon.ts), from `pnpm icons` too.
    - from: build/themes
      to: dock-icons
  extendInfo:
    CFBundleIconName: Icon
  target:
    - dmg
    - zip
  hardenedRuntime: true
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
# Where the app looks for updates (electron-updater, src/main/updater.ts). Builds
# run with --publish never and CI uploads the files, latest-mac.yml and latest.yml included.
publish:
  provider: github
  owner: janoelze
  repo: cmd
