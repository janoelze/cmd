# Packages the built app (out/) plus the staged core runtime (.runtime, from
# scripts/stage-runtime.mjs) into a macOS .app, .dmg and .zip.
# Signing and notarization kick in when CSC_LINK / APPLE_* are set (see .github/workflows).
appId: dev.janoelze.cmd
productName: cmd
copyright: Copyright © 2026 Jan Oelze
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!node_modules/**/*"
extraResources:
  - from: .runtime
    to: runtime
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  # icon.icns is the flat icon for macOS 15 and older; macOS 26 uses the Liquid Glass
  # icon in Assets.car (named by CFBundleIconName). Both come from build/icon.icon
  # via `pnpm icons` and are committed, so CI needs no Xcode 26.
  icon: build/icon.icns
  extraResources:
    - from: build/Assets.car
      to: Assets.car
  extendInfo:
    CFBundleIconName: Icon
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-${arch}.${ext}
# Where the app looks for updates (electron-updater, src/main/updater.ts). Builds
# run with --publish never and CI uploads the files, latest-mac.yml included.
publish:
  provider: github
  owner: janoelze
  repo: cmd
