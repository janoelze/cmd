# `pnpm dist`: a local development build, "cmd dev" with the red icon (build/dev,
# from `pnpm icons`). It installs next to the released app and keeps its own core
# and state (src/main/index.ts). CI packages with electron-builder.yml itself.
extends: ./electron-builder.yml
appId: dev.janoelze.cmd.dev
productName: cmd dev
win:
  icon: build/dev/icon.ico
mac:
  icon: build/dev/icon.icns
  extraResources:
    - from: build/dev/Assets.car
      to: Assets.car
# Two markers make this build the dev instance, whatever the .app is called (src/main/flavor.ts).
# Into the packaged package.json, read by Electron main; productName too, so
# app.getName() says "cmd dev" from the start:
extraMetadata:
  productName: cmd dev
  cmdFlavor: dev
# And Resources/runtime/instance, read by main and by the core, which then never opens
# the installed app's data, whatever instance it's told to be (protocol/instance.ts,
# codeInstance). Added to electron-builder.yml's list: `extends` concatenates them.
extraResources:
  - from: build/dev/instance
    to: runtime/instance
