# Typecheck, test and package the macOS app on every push and PR.
# A Windows job runs the same checks while the Windows port is in progress
# (continue-on-error until it passes; see docs/10-windows.md).
# Pushing a tag `v*` additionally signs + notarizes (when the secrets below exist)
# and publishes a GitHub release with the .dmg and .zip.
#
# Signing secrets (all optional; without them the app is ad-hoc signed):
#   MAC_CERT_P12_BASE64   Developer ID Application certificate (.p12), base64
#   MAC_CERT_PASSWORD     password of that .p12
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   for notarization
name: build

on:
  push:
    branches: [master, windows]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  mac:
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Build and stage
        run: |
          pnpm build
          node scripts/stage-runtime.mjs

      # The e2e test runs the core from source; this boots the staged copy the app ships.
      - name: Check the staged core starts
        run: node --no-warnings scripts/check-runtime.mjs

      - name: Package
        working-directory: apps/desktop
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
        run: |
          # electron-builder treats an empty CSC_LINK as a path; unset what's empty.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          [ -z "${CSC_LINK:-}" ] && export CSC_IDENTITY_AUTO_DISCOVERY=false
          if [ "$IS_TAG" = true ]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          pnpm exec electron-builder --mac --publish never -c.extraMetadata.version="$version"

      - uses: actions/upload-artifact@v4
        with:
          name: cmd-mac
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" apps/desktop/dist/*.dmg apps/desktop/dist/*.zip \
            --title "$GITHUB_REF_NAME" --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)

  windows:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Smoke test (Playwright drives the built app)
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: .cmd-dev/shots
          if-no-files-found: ignore

      - name: Core log
        if: failure()
        run: cat .cmd-dev/e2e/core.log || true
