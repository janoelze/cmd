# Typecheck, test, smoke-test and package the app for macOS on every push and PR. The
# smoke test is a job of its own, next to the one that tests and packages, so a red smoke
# never hides whether the app packages, signs and boots; a release needs both.
# Pushing a tag `v*` additionally signs + notarizes the macOS dmg (when the
# secrets below exist) and publishes one GitHub release: the .dmg and .zip, and
# the update metadata (latest-mac.yml, blockmaps) installed apps update from.
# A tag without a CHANGELOG.md section fails; that section is the release's notes.
# The Windows job is disabled for now (`if: false`); re-enable it and add it to
# the release's `needs` to ship Windows builds again.
#
# CMD_CRASH_WEBHOOK (optional): the Discord webhook release builds send crash
# reports to (apps/desktop/src/main/crash.ts). Without it they keep them locally.
# CMD_FEEDBACK_WEBHOOK (optional): the Discord webhook Help → Send Feedback…
# posts to (apps/desktop/src/main/feedback.ts). Without it the form can't send.
# CMD_USAGE_URL=off: apps launched here (e2e) send no usage stats; each run would
# count as a new install.
# CMD_USAGE_SECRET: what release builds derive their usage stats signing key from
# (apps/desktop/electron.vite.config.ts); the website has the same one in
# ~/cmd-website-data/usage-secret. Without it releases send unsigned batches,
# which the server rejects.
#
# Signing secrets (a tag build fails without them: an ad-hoc signed release can't update
# installed apps; other builds are ad-hoc signed, see DEVELOPMENT.md):
#   MAC_CERT_P12_BASE64   Developer ID Application certificate (.p12), base64
#   MAC_CERT_PASSWORD     password of that .p12
# Notarization, either an App Store Connect API key (preferred):
#   APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER
# or an Apple ID:
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
name: build

on:
  push:
    branches: [master, windows]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CMD_USAGE_URL: "off"

jobs:
  mac:
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 50 # notarization alone can take 20+ min when Apple is slow
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version # Electron's Node major, which runs the packaged core
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Before the long build: a release needs its CHANGELOG.md section (What's New shows it).
      - name: Changelog
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: node scripts/changelog.mjs check "${GITHUB_REF_NAME#v}"

      - run: pnpm typecheck

      # What the system tests need (test/system.ts: needs() fails under CI rather than skipping).
      # The Deno widgets pin (DENO_VERSION in packages/core/src/widgets/deno.ts), installed by
      # cmd's own installDeno, so its hash and signature are checked here too.
      - name: Deno for the widget tests
        run: |
          node --no-warnings --input-type=module -e '
            const { installDeno, denoVersion } = await import("./packages/core/src/widgets/deno.ts");
            console.log(denoVersion(await installDeno(process.env.RUNNER_TEMP)));'
          echo "$RUNNER_TEMP/runtime/deno" >> "$GITHUB_PATH"

      # Playwright's Chromium, for the kit's Dialog focus tests (packages/ui/test/dialog.test.ts).
      - run: pnpm exec playwright install chromium

      - run: pnpm test

      # One version for app.getVersion(), What's New and the usage stats key: a release tag
      # must equal apps/desktop/package.json's, a prerelease's is written into it here.
      - name: Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-version.mjs "$GITHUB_REF_NAME"

      - name: Build and stage
        env:
          CMD_CRASH_WEBHOOK: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CMD_CRASH_WEBHOOK || '' }}
          CMD_FEEDBACK_WEBHOOK: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CMD_FEEDBACK_WEBHOOK || '' }}
          CMD_USAGE_SECRET: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CMD_USAGE_SECRET || '' }}
        run: |
          pnpm build
          node scripts/stage-runtime.mjs

      # The smoke job runs the core from source; this boots the staged copy the app ships.
      - name: Check the staged core starts
        run: node --no-warnings scripts/check-runtime.mjs

      - name: Package
        working-directory: apps/desktop
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          MAC_CERT_P12_BASE64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MAC_CERT_P12_BASE64 || '' }}
          MAC_CERT_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_API_KEY_P8_BASE64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_KEY_P8_BASE64 || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
        run: |
          for v in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          # electron-builder wants the API key as a file.
          if [ -n "${APPLE_API_KEY_P8_BASE64:-}" ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$APPLE_API_KEY"
          fi
          sign=()
          if [ -n "${MAC_CERT_P12_BASE64:-}" ]; then
            # Import the certificate ourselves: electron-builder's own temp keychain
            # (CSC_LINK) fails set-key-partition-list on current runners.
            kc="$RUNNER_TEMP/signing.keychain-db"
            kcpw=$(openssl rand -hex 24)
            echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$kcpw" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kcpw" "$kc"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/cert.p12"
            security find-identity -v -p codesigning "$kc"
            # New releases need a valid certificate (the release skill says how to renew it).
            security find-certificate -c "Developer ID Application" -p "$kc" | openssl x509 -noout -checkend $((30 * 86400)) >/dev/null ||
              echo "::warning::The Developer ID certificate expires within 30 days: renew it before the next release"
            if [ -z "${APPLE_API_KEY:-}${APPLE_ID:-}" ]; then
              # Gatekeeper blocks a Developer ID app that isn't notarized, so don't ship one.
              echo "::error::Certificate set but no APPLE_API_* or APPLE_ID secrets to notarize with"
              exit 1
            fi
          else
            # No Developer ID: ad-hoc sign the whole bundle. Unsigned, a downloaded
            # arm64 app only has the linker's signature and macOS calls it "damaged".
            # On a pull request electron-builder skips signing unless told not to.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            export CSC_FOR_PULL_REQUEST=true
            sign=(-c.mac.identity=-)
            if [ "$IS_TAG" = true ]; then
              # Installed apps only take an update signed like them, so an ad-hoc release strands them.
              echo "::error::No signing secrets (MAC_CERT_P12_BASE64): a tag build must be Developer ID signed, so nothing is released"
              exit 1
            fi
          fi
          # A tag's version is package.json's (the Version step made them equal).
          if [ "$IS_TAG" = true ]; then version=$(node -p 'require("./package.json").version'); else version="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          builder=(pnpm exec electron-builder --publish never -c.extraMetadata.version="$version" "${sign[@]}")
          # One notarization, of the dmg (Apple's advice: the outermost container), not
          # one for the app and another for the dmg: each waits in Apple's queue, which
          # can take minutes. electron-builder signs the app (mac.notarize: false) ...
          "${builder[@]}" --mac dmg
          if [ -n "${MAC_CERT_P12_BASE64:-}" ]; then
            if [ -n "${APPLE_API_KEY:-}" ]; then
              auth=(--key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
            else
              auth=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
            fi
            for dmg in dist/*.dmg; do
              codesign --sign "Developer ID Application" --timestamp "$dmg"
              # Bounded, so a submission Apple holds fails here rather than at the job timeout.
              xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 40m
              xcrun stapler staple "$dmg"
            done
            # ... and the dmg's ticket covers the app inside, so the app can be stapled too.
            xcrun stapler staple dist/mac-arm64/cmd.app
          fi
          # The update zip, from the stapled app (--prepackaged doesn't re-sign). A zip can't
          # carry a ticket, so the app in it must. Its latest-mac.yml and blockmap replace the
          # dmg pass's, whose hashes predate stapling.
          rm -f dist/*.blockmap dist/latest-mac.yml
          "${builder[@]}" --mac zip --prepackaged dist/mac-arm64/cmd.app

      # Fail rather than publish an app macOS refuses to open.
      - name: Verify signature
        working-directory: apps/desktop
        run: |
          app=dist/mac-arm64/cmd.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature|flags'
          if codesign -dvv "$app" 2>&1 | grep -q 'Authority=Developer ID Application'; then
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
            for dmg in dist/*.dmg; do
              spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
              xcrun stapler validate "$dmg"
            done
          fi

      # The packaged app itself: window, bundled core, a terminal with a prompt.
      - name: Check the packaged app
        run: node e2e/packaged.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: cmd-mac
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml
          if-no-files-found: error

  # Playwright drives the built app through the real menu bar (e2e/smoke.mjs), against a
  # throwaway CMD_HOME (.cmd-dev/e2e) and fixture transcripts. It builds the app itself
  # (seconds) rather than wait for the mac job's build, so both run side by side. Panes run
  # zsh, the Mac default (a runner's $SHELL may be bash). The script runs every scenario,
  # lists each failure at the end, and has its own 90 s hang watchdog. Two apps share the
  # scenarios (--shards), each with its own CMD_HOME (.cmd-dev/e2e-<n>).
  smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Deno runs Magic widgets' data.ts (the magic scenario), as in the mac job's tests.
      - name: Deno for widget data
        run: |
          node --no-warnings --input-type=module -e '
            const { installDeno, denoVersion } = await import("./packages/core/src/widgets/deno.ts");
            console.log(denoVersion(await installDeno(process.env.RUNNER_TEMP)));'
          echo "$RUNNER_TEMP/runtime/deno" >> "$GITHUB_PATH"

      - run: pnpm build

      - name: Smoke test
        timeout-minutes: 12
        env:
          CMD_NO_SANDBOX: "1"
          SHELL: /bin/zsh
        run: node e2e/smoke.mjs --shards 2

      - name: Smoke test screenshots and core logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-mac
          path: |
            .cmd-dev/shots
            .cmd-dev/e2e*/logs
          include-hidden-files: true # .cmd-dev is hidden: without this nothing is uploaded
          if-no-files-found: ignore

  windows:
    if: false # disabled for now
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version # Electron's Node major, which runs the packaged core
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Smoke test (Playwright drives the built app)
        env:
          CMD_CRASH_WEBHOOK: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CMD_CRASH_WEBHOOK || '' }}
          CMD_FEEDBACK_WEBHOOK: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CMD_FEEDBACK_WEBHOOK || '' }}
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: .cmd-dev/shots
          if-no-files-found: ignore

      - name: Core log
        if: failure()
        run: tail -n +1 .cmd-dev/e2e/logs/*.log || true

      # pnpm e2e has built the app; stage the core it ships and check it boots.
      - name: Stage and check the core
        run: |
          node scripts/stage-runtime.mjs
          node --no-warnings scripts/check-runtime.mjs

      - name: Package
        working-directory: apps/desktop
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ "$IS_TAG" = true ]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          pnpm exec electron-builder --win --publish never -c.extraMetadata.version="$version"

      - name: Check the packaged app
        run: node e2e/packaged.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: cmd-windows
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error

  # A tag publishes one release with the platforms' builds.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No pnpm here: setup-node v5 would otherwise cache with pnpm (from packageManager) and fail.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version # Electron's Node major, which runs the packaged core
          package-manager-cache: false

      - uses: actions/download-artifact@v4
        with:
          pattern: cmd-*
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          # The notes are the release's CHANGELOG.md section; prereleases have none.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            notes=(--generate-notes --prerelease)
          else
            node scripts/changelog.mjs notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          fi
          # latest-mac.yml, latest.yml and the blockmaps are what installed apps update from (src/main/updater.ts).
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" "${notes[@]}"
