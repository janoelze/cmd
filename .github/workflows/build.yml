# Typecheck, test and package the macOS app on every push and PR.
# Pushing a tag `v*` additionally signs + notarizes (when the secrets below exist)
# and publishes a GitHub release with the .dmg and .zip.
#
# Signing secrets (all optional; without them the app is ad-hoc signed, see DEVELOPMENT.md):
#   MAC_CERT_P12_BASE64   Developer ID Application certificate (.p12), base64
#   MAC_CERT_PASSWORD     password of that .p12
# Notarization, either an App Store Connect API key (preferred):
#   APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER
# or an Apple ID:
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  mac:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Build and stage
        run: |
          pnpm build
          node scripts/stage-runtime.mjs

      # The e2e test runs the core from source; this boots the staged copy the app ships.
      - name: Check the staged core starts
        run: node --no-warnings scripts/check-runtime.mjs

      - name: Package
        working-directory: apps/desktop
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          MAC_CERT_P12_BASE64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MAC_CERT_P12_BASE64 || '' }}
          MAC_CERT_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_API_KEY_P8_BASE64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_KEY_P8_BASE64 || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
        run: |
          for v in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          # electron-builder wants the API key as a file.
          if [ -n "${APPLE_API_KEY_P8_BASE64:-}" ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$APPLE_API_KEY"
          fi
          sign=()
          if [ -n "${MAC_CERT_P12_BASE64:-}" ]; then
            # Import the certificate ourselves: electron-builder's own temp keychain
            # (CSC_LINK) fails set-key-partition-list on current runners.
            kc="$RUNNER_TEMP/signing.keychain-db"
            kcpw=$(openssl rand -hex 24)
            echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$kcpw" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kcpw" "$kc"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/cert.p12"
            security find-identity -v -p codesigning "$kc"
            if [ -z "${APPLE_API_KEY:-}${APPLE_ID:-}" ]; then
              # Gatekeeper blocks a Developer ID app that isn't notarized, so don't ship one.
              echo "::error::Certificate set but no APPLE_API_* or APPLE_ID secrets to notarize with"
              exit 1
            fi
          else
            # No Developer ID: ad-hoc sign the whole bundle. Unsigned, a downloaded
            # arm64 app only has the linker's signature and macOS calls it "damaged".
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            sign=(-c.mac.identity=-)
            [ "$IS_TAG" = true ] && echo "::warning::No signing secrets: this release is ad-hoc signed, not notarized"
          fi
          if [ "$IS_TAG" = true ]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          pnpm exec electron-builder --mac --publish never -c.extraMetadata.version="$version" "${sign[@]}"
          # electron-builder notarizes the app; the dmg around it is signed and gets its own ticket.
          if [ -n "${MAC_CERT_P12_BASE64:-}" ]; then
            if [ -n "${APPLE_API_KEY:-}" ]; then
              auth=(--key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
            else
              auth=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
            fi
            for dmg in dist/*.dmg; do
              codesign --sign "Developer ID Application" --timestamp "$dmg"
              xcrun notarytool submit "$dmg" "${auth[@]}" --wait
              xcrun stapler staple "$dmg"
            done
          fi

      # Fail rather than publish an app macOS refuses to open.
      - name: Verify signature
        working-directory: apps/desktop
        run: |
          app=dist/mac-arm64/cmd.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature|flags'
          if codesign -dvv "$app" 2>&1 | grep -q 'Authority=Developer ID Application'; then
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
            for dmg in dist/*.dmg; do
              spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
              xcrun stapler validate "$dmg"
            done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cmd-mac
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" apps/desktop/dist/*.dmg apps/desktop/dist/*.zip \
            --title "$GITHUB_REF_NAME" --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
