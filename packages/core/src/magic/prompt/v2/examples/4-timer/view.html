<style>
.clock{font-size:clamp(36px,20vmin,96px);font-weight:600;letter-spacing:-.02em;line-height:1}
.progress{width:min(100%,320px)}
</style>
<div class="k-app">
  <div class="k-toolbar k-plain">
    <span class="k-dot" id="dot"></span><b id="phase">Focus</b>
    <span class="k-spacer"></span>
    <span class="k-dim k-small" id="today"></span>
  </div>
  <div class="k-hero">
    <div class="k-mono clock" id="clock">25:00</div>
    <div class="k-bar progress"><i id="progress" style="--v:0%"></i></div>
  </div>
  <div class="k-footer k-plain">
    <button class="k-btn k-primary" id="go"><i class="k-icon k-icon-sm" data-icon="play" id="goIcon"></i><span id="goLabel">Start</span></button>
    <button class="k-btn k-ghost k-icon-only" id="reset" aria-label="Reset"><i class="k-icon" data-icon="reset"></i></button>
    <span class="k-spacer"></span>
    <div class="k-seg" id="lengths"><button data-min="15">15</button><button data-min="25">25</button><button data-min="50">50</button></div>
  </div>
</div>
