<style>
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--bar-inset);box-shadow:inset 0 -1px 0 var(--window-edge)}
.name{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.name b,.name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim{color:var(--text-dim);font-size:var(--text-sm)}
.dot{width:8px;height:8px;border-radius:var(--radius-pill);background:var(--text-faint)}
.dot.live{background:var(--success)}.dot.connecting{background:var(--warning)}.dot.error{background:var(--danger)}
.hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-3)}
button{display:inline-flex;align-items:center;justify-content:center;border:0;color:var(--text);background:var(--control-bg);box-shadow:0 0 0 1px var(--control-edge);border-radius:var(--radius-pill);cursor:default}
button:hover{background:var(--control-hover)}
button svg{width:16px;height:16px;fill:currentColor}
.play{width:56px;height:56px;color:var(--on-accent);background:var(--accent);box-shadow:none}
.play:hover{background:var(--accent);filter:brightness(1.08)}
.play svg{width:22px;height:22px}
.meter{display:flex;align-items:flex-end;gap:3px;height:22px}
.meter i{width:4px;height:100%;border-radius:var(--radius-xs);background:var(--bg-hover);transform-origin:bottom;transform:scaleY(.15)}
.on .meter i{background:var(--accent)}
.foot{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-1-5) var(--bar-inset);box-shadow:inset 0 1px 0 var(--window-edge)}
.ghost{width:var(--control-h);height:var(--control-h);background:none;box-shadow:none}
.ghost.muted{color:var(--text-faint)}
input[type=range]{flex:1;max-width:220px;accent-color:var(--accent)}
a{color:var(--link);text-decoration:none;font-size:var(--text-sm);margin-left:auto}
</style>
<div class="app" id="app">
  <div class="bar">
    <div class="name"><b>Bassdrive</b><span class="dim">24/7 drum &amp; bass · 192 kbps</span></div>
    <span class="dot" id="dot"></span><span class="dim" id="state">Off</span>
  </div>
  <div class="hero">
    <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="glyph"><path d="M8 5v14l11-7z"/></svg></button>
    <div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <span class="dim" id="detail">Press play to tune in</span>
  </div>
  <div class="foot">
    <button class="ghost" id="mute" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9z"/></svg></button>
    <input id="volume" type="range" min="0" max="1" step="0.01" aria-label="Volume">
    <a href="https://bassdrive.com/">bassdrive.com</a>
  </div>
  <audio id="audio" preload="none" crossorigin="anonymous" src="https://bassdrive.radioca.st/stream"></audio>
</div>
<script type="module">
const $ = (id) => document.getElementById(id);
const audio = $("audio");
const volume = $("volume");
const bars = [...$("meter").children];
const PLAY = "M8 5v14l11-7z", PAUSE = "M7 5h4v14H7zM13 5h4v14h-4z";

// The volume is the window's own (cmd.state), so it is there next time.
const saved = cmd.state.get("volume");
audio.volume = typeof saved === "number" ? Math.min(1, Math.max(0, saved)) : 0.7;
volume.value = String(audio.volume);

function show(state, detail) {
  const live = state === "live" || state === "connecting";
  $("app").classList.toggle("on", state === "live");
  $("dot").className = "dot " + state;
  $("state").textContent = { off: "Off", connecting: "Connecting", live: "Live", error: "Offline" }[state];
  $("detail").textContent = detail;
  $("glyph").innerHTML = `<path d="${live ? PAUSE : PLAY}"/>`;
  $("play").setAttribute("aria-label", live ? "Pause" : "Play");
}

// A level meter from the audio itself (the stream allows it: it sends CORS headers).
let analyser = null;
let levels = null;
function listen() {
  if (analyser) return;
  try {
    const ctx = new AudioContext();
    analyser = ctx.createAnalyser();
    analyser.fftSize = 64;
    ctx.createMediaElementSource(audio).connect(analyser);
    analyser.connect(ctx.destination);
    levels = new Uint8Array(analyser.frequencyBinCount);
    void ctx.resume();
  } catch {
    analyser = null;
  }
}
function frame() {
  requestAnimationFrame(frame);
  const on = analyser && levels && !audio.paused;
  if (on) analyser.getByteFrequencyData(levels);
  bars.forEach((b, i) => (b.style.transform = `scaleY(${on ? Math.max(0.15, levels[2 + i * 3] / 255) : 0.15})`));
}
frame();

$("play").onclick = () => {
  if (!audio.paused) return audio.pause();
  listen();
  show("connecting", "Connecting…");
  audio.load();
  audio.play().catch(() => show("error", "The stream didn't start"));
};
$("mute").onclick = () => {
  audio.muted = !audio.muted;
  $("mute").classList.toggle("muted", audio.muted);
  $("mute").setAttribute("aria-label", audio.muted ? "Unmute" : "Mute");
};
volume.oninput = () => {
  audio.volume = Number(volume.value);
  cmd.state.set("volume", audio.volume);
};
audio.onplaying = () => show("live", "Live from bassdrive.com");
audio.onwaiting = () => show("connecting", "Buffering…");
audio.onpause = () => show("off", "Paused");
audio.onerror = () => show("error", "Stream unavailable");
show("off", "Press play to tune in");
</script>
