<style>
.meter{display:flex;align-items:flex-end;gap:3px;height:22px}
.meter i{width:4px;height:100%;border-radius:2px;background:var(--bg-hover);transform-origin:bottom;transform:scaleY(.15)}
.on .meter i{background:var(--accent)}
.vol{max-width:220px}
</style>
<div class="k-app" id="app">
  <div class="k-toolbar k-plain">
    <div class="k-stack" style="gap:1px;min-width:0">
      <b class="k-ellipsis">Bassdrive</b>
      <span class="k-dim k-small k-ellipsis">24/7 drum &amp; bass · 192 kbps</span>
    </div>
    <span class="k-spacer"></span>
    <span class="k-dot" id="dot"></span><span class="k-small" id="state">Off</span>
  </div>
  <div class="k-hero">
    <button class="k-btn k-primary k-xl" id="play" aria-label="Play"><i class="k-icon" data-icon="play" id="glyph"></i></button>
    <div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <span class="k-dim k-small" id="detail">Press play to tune in</span>
  </div>
  <div class="k-footer k-plain">
    <button class="k-btn k-ghost k-icon-only" id="mute" aria-label="Mute"><i class="k-icon" data-icon="volume" id="muteIcon"></i></button>
    <input class="k-range vol" id="volume" type="range" min="0" max="1" step="0.01" aria-label="Volume">
    <span class="k-spacer"></span>
    <a class="k-small k-dim" href="https://bassdrive.com/">bassdrive.com</a>
  </div>
  <audio id="audio" preload="none" crossorigin="anonymous" src="https://bassdrive.radioca.st/stream"></audio>
</div>
<script type="module">
const $ = (id) => document.getElementById(id);
const audio = $("audio");
const volume = $("volume");
const bars = [...$("meter").children];

const saved = cmd.state.get("volume");
audio.volume = typeof saved === "number" ? Math.min(1, Math.max(0, saved)) : 0.7;
volume.value = String(audio.volume);


function show(state, detail) {
  const live = state === "live" || state === "connecting";
  $("app").classList.toggle("on", state === "live");
  $("dot").className = "k-dot " + (state === "live" ? "k-good" : state === "connecting" ? "k-warn" : state === "error" ? "k-bad" : "");
  $("state").textContent = { off: "Off", connecting: "Connecting", live: "Live", error: "Offline" }[state];
  $("detail").textContent = detail;
  $("glyph").dataset.icon = live ? "pause" : "play";
  $("play").setAttribute("aria-label", live ? "Pause" : "Play");
}

// A level meter from the audio itself (the stream allows it: it sends CORS headers).
let analyser = null;
let levels = null;
function listen() {
  if (analyser) return;
  try {
    const ctx = new AudioContext();
    analyser = ctx.createAnalyser();
    analyser.fftSize = 64;
    ctx.createMediaElementSource(audio).connect(analyser);
    analyser.connect(ctx.destination);
    levels = new Uint8Array(analyser.frequencyBinCount);
    void ctx.resume();
  } catch {
    analyser = null;
  }
}
function frame() {
  requestAnimationFrame(frame);
  const on = analyser && levels && !audio.paused;
  if (on) analyser.getByteFrequencyData(levels);
  bars.forEach((b, i) => (b.style.transform = `scaleY(${on ? Math.max(0.15, levels[2 + i * 3] / 255) : 0.15})`));
}
frame();

$("play").onclick = () => {
  if (!audio.paused) return audio.pause();
  listen();
  show("connecting", "Connecting…");
  audio.load();
  audio.play().catch(() => show("error", "The stream didn't start (media not allowed?)"));
};
$("mute").onclick = () => {
  audio.muted = !audio.muted;
  $("muteIcon").dataset.icon = audio.muted ? "mute" : "volume";
};
volume.oninput = () => {
  audio.volume = Number(volume.value);
  cmd.state.set("volume", audio.volume);
};
audio.onplaying = () => show("live", "Live from bassdrive.com");
audio.onwaiting = () => show("connecting", "Buffering…");
audio.onpause = () => show("off", "Paused");
audio.onerror = () => show("error", "Stream unavailable");
show("off", "Press play to tune in");
</script>
